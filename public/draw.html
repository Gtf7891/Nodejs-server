<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>抽签器</title>
  <style>
    body { font-family: monospace; background: #1a1a1a; color: #ddd; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #55ff55; }
    textarea { width: 100%; height: 180px; background: #222; color: #ddd; border: 1px solid #444; padding: 10px; box-sizing: border-box; font-family: monospace; }
    button { background: #3a5a3a; color: #afa; border: 1px solid #5a8a5a; padding: 10px 24px; cursor: pointer; font-size: 16px; margin-top: 12px; margin-right: 8px; }
    button:hover { background: #4a6a4a; }
    #result { font-size: 48px; color: #55ff55; text-align: center; margin: 32px 0; min-height: 80px; }
    #msg { color: #ffaa00; margin-top: 12px; }
    a { color: #55ff55; }
    .small { color: #888; font-size: 12px; }
  </style>
</head>
<body>
  <h1>🎲 抽签器</h1>
  <p class="small">每行一个名字，仅你自己可见。点击「抽取」随机选一个。</p>

  <textarea id="list" placeholder="张三&#10;李四&#10;王五"></textarea>
  <div>
    <button id="btn-save">保存列表</button>
    <button id="btn-draw">抽取</button>
  </div>
  <div id="result"></div>
  <div id="msg"></div>
  <p><a href="/">返回首页</a></p>

  <script>
    const token = localStorage.getItem('token');
    if (!token) location.href = '/login.html';

    async function load() {
      const r = await fetch('/api/tickets', { headers: { 'Authorization': `Bearer ${token}` } });
      if (r.status === 401) { location.href = '/login.html'; return; }
      const d = await r.json();
      if (d.list) document.getElementById('list').value = d.list.join('\n');
      if (d.updatedBy) document.getElementById('msg').textContent = `上次更新：${d.updatedBy} · ${new Date(d.updatedAt).toLocaleString()}`;
    }

    document.getElementById('btn-save').onclick = async () => {
      const lines = document.getElementById('list').value.split('\n').map(s => s.trim()).filter(Boolean);
      if (!lines.length) { document.getElementById('msg').textContent = '列表为空'; return; }
      const r = await fetch('/api/tickets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ list: lines })
      });
      if (r.ok) document.getElementById('msg').textContent = '✅ 已保存';
    };

    document.getElementById('btn-draw').onclick = async () => {
      const r = await fetch('/api/tickets', { headers: { 'Authorization': `Bearer ${token}` } });
      const d = await r.json();
      const list = d.list || [];
      if (!list.length) { document.getElementById('msg').textContent = '列表为空，先保存'; return; }
      const el = document.getElementById('result');
      let count = 0;
      const timer = setInterval(() => {
        el.textContent = list[Math.floor(Math.random() * list.length)];
        if (++count > 20) {
          clearInterval(timer);
          el.textContent = list[Math.floor(Math.random() * list.length)];
        }
      }, 50);
    };

    load();
  </script>
</body>
</html>
